ocument-role=\"page\" data-label=\"Product roadmap: Verified Answers for the research analyst\">\n\n<header style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1240px\">\n<div style=\"display: flex; gap: 10px; align-items: center\">\n<span style=\"background: #3d4240; color: #c8e751; font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.12em; padding: 7px 12px; border-radius: 4px\">PRODUCT ROADMAP<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.12em; color: #4a5250\">CHAINSIGNAL · PM PORTFOLIO · STEP 6<\u002Fspan>\n<\u002Fdiv>\n<h1 style=\"margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; color: #2a2e2c\">Build only what proves an analyst can trust her first answer<\u002Fh1>\n<p style=\"margin: 0; font-size: 22px; line-height: 1.4; color: #3d4240\">Initiative: Verified Answers. 11 backlog items scored on Effort vs. Value, audited against the M3 metric, and sliced into Now / Next / Later. Team: 2 engineers + 1 designer (assumed), 4-week sprints.<\u002Fp>\n<\u002Fdiv>\n<div style=\"width: 440px; flex-shrink: 0; border: 1px solid #3d4240; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; background: #ffffff\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #4a5250\">HYPOTHESIS · STEP 3<\u002Fspan>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; color: #2a2e2c\">Making an analyst's first real question answerable and checkable lifts first-session activation from 41% to 56%.<\u002Fp>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #4a6340\">01 · PERSONA<\u002Fspan>\n<span style=\"font-size: 24px; font-weight: 700; line-height: 1.2\">Maya, the non-SQL research analyst<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.45; color: #3d4240\">Writes memos at a small fund or crypto media outlet. Needs a number she can defend, the same day.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #2a2e2c; color: #f5f4f0; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #c8e751\">PRIMARY METRIC · M3<\u002Fspan>\n<span style=\"font-size: 40px; font-weight: 700; line-height: 1.05; color: #c8e751\">41% → 56%<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.45\">Analyst first-session activation: her first question gets an answer, from a template or the concierge.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #4a6340\">MOMENT OF MISERY<\u002Fspan>\n<span style=\"font-size: 24px; font-weight: 700; line-height: 1.2\">46% of her first questions go unanswered<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.45; color: #3d4240\">And an answer without a method is one she can't defend, so she waits 1–3 days or publishes blind.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #4a6340\">GUARDRAIL<\u002Fspan>\n<span style=\"font-size: 24px; font-weight: 700; line-height: 1.2\">Answer errors under 2%<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.45; color: #3d4240\">Trader and SQL-native activation must not fall. A fast wrong answer is worse than none.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: grid; grid-template-columns: 956px minmax(0, 1fr); gap: 24px\">\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.1em; color: #4a6340\">02 · EFFORT VS. VALUE MATRIX<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">Value 4+ is high · Effort 2 or less is low<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px\">\n<div style=\"width: 28px; display: flex; align-items: center; justify-content: center\">\n<span style=\"transform: rotate(-90deg); white-space: nowrap; font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #4a5250\">VALUE → LIFT ON M3 METRIC<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: relative; width: 860px; height: 520px; border-radius: 10px; overflow: hidden\">\n<div style=\"position: absolute; left: 0; top: 0; width: 344px; height: 208px; background: #eef3d6\"><\u002Fdiv>\n<div style=\"position: absolute; left: 344px; top: 0; width: 516px; height: 208px; background: #f5f4f0\"><\u002Fdiv>\n<div style=\"position: absolute; left: 0; top: 208px; width: 344px; height: 312px; background: #f0efea\"><\u002Fdiv>\n<div style=\"position: absolute; left: 344px; top: 208px; width: 516px; height: 312px; background: #ebe9e2\"><\u002Fdiv>\n<div style=\"position: absolute; left: 343px; top: 0; width: 2px; height: 520px; background: #d6d4cc\"><\u002Fdiv>\n<div style=\"position: absolute; left: 0; top: 207px; width: 860px; height: 2px; background: #d6d4cc\"><\u002Fdiv>\n\n<div style=\"position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; font-weight: 500; color: #2a2e2c\">QUICK WINS<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250\">Now · build first<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: absolute; left: 40px; top: 96px; width: 264px; font-size: 15px; line-height: 1.4; color: #3d4240; font-style: italic\">Empty: no high-value item ships in days. Now is a judgment call, not a default.<\u002Fdiv>\n<div style=\"position: absolute; right: 16px; top: 14px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; font-weight: 500; color: #2a2e2c\">MAJOR PROJECTS<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250\">Next · big bets<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: absolute; left: 16px; top: 222px; display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; font-weight: 500; color: #2a2e2c\">FILL-INS<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250\">Later · spare capacity<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: absolute; right: 16px; top: 222px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; font-weight: 500; color: #2a2e2c\">TIME SINKERS<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250\">Defer / kill<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 392px; top: 38px; width: 28px; height: 28px; box-sizing: border-box; the cold AI scoring<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 56px; font-weight: 700; line-height: 1\">4<\u002Fspan><span style=\"font-size: 15px; line-height: 1.4\">moved again once Step 3 data set the M3 metric<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.45; color: #d6d4cc\">The AI scored what sounds valuable in general: revenue, parity, convenience. The audit scored what moves analyst activation.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 22px 26px; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #4a6340; padding-bottom: 8px\">WHAT THE AUDIT CHANGED<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: 210px 150px minmax(0, 1fr); column-gap: 14px; font-size: 15px; line-height: 1.4\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250; padding: 6px 0\">FEATURE<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250; padding: 6px 0\">AI → FINAL<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 12px; color: #4a5250; padding: 6px 0\">WHY<\u002Fspan>\n<span style=\"font-weight: 700; padding: 8px 0; border-top: 1px solid #ebe9e2\">B9 Trade execution<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Next → Cut<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Chased revenue; traders show 0.5% pricing intent<\u002Fspan>\n<span style=\"font-weight: 700; padding: 8px 0; border-top: 1px solid #ebe9e2\">B6 Wallet alerts<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Next → Cut<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">9% of analysts use alerts vs. 41% of traders<\u002Fspan>\n<span style=\"font-weight: 700; padding: 8px 0; border-top: 1px solid #ebe9e2\">B7 Dropdowns<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Now → Later<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">\"No SQL\" is table stakes; suggested questions steer instead<\u002Fspan>\n<span style=\"font-weight: 700; padding: 8px 0; border-top: 1px solid #ebe9e2\">B5 What + who<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Next → Later<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">The differentiator, but it doesn't create a first answer<\u002Fspan>\n<span style=\"font-weight: 700; padding: 8px 0; border-top: 1px solid #ebe9e2\">B2 Drill-down<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Cut → Next<\u002Fspan>\n<span style=\"padding: 8px 0; border-top: 1px solid #ebe9e2\">Matters for verification, after the first answer exists<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #2a2e2c; color: #f5f4f0; border-radius: 18px; padding: 30px 32px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.1em; color: #c8e751\">03 · NOW / NEXT / LATER<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">V = value · E = effort · ⚑ override of the quadrant default<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start\">\n\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #c8e751; color: #2a2e2c; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline\"><span style=\"font-weight: 700; font-size: 21px\">Now<\u002Fspan><span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px\">4-week sprint · 3 pts<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600\">Make the first answer checkable, and test whether answering is the lever<\u002Fp>\n<div style=\"background: #3d4240; border: 2px solid #c8e751; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #c8e751\">B1 · V5 · E3 · ⚑ MAJOR PROJECT KEPT IN NOW<\u002Fspan>\n<span style=\"font-size: 22px; font-weight: 700; line-height: 1.2\">Plain-English Method Card<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.45\">Every answer shows how its number was computed and copies with its citation. Unsupported questions are refused, and a beta concierge answers the first ones templates can't.<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.4; color: #d6d4cc\">The hypothesis test: the decision window starts when it ships.<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; border: 1px solid #c8e751; color: #c8e751; padding: 4px 8px; border-radius: 6px\">first_question_outcome<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; border: 1px solid #c8e751; color: #c8e751; padding: 4px 8px; border-radius: 6px\">method_expanded<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; border: 1px solid #c8e751; color: #c8e751; padding: 4px 8px; border-radius: 6px\">concierge_requested<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border: 1px dashed #9aa39f; border-radius: 12px; padding: 14px 18px; font-size: 15px; line-height: 1.45; color: #d6d4cc\">Slack left empty on purpose: anything else shipped now would blur the beta's read on B1.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #f5f4f0; color: #2a2e2c; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline\"><span style=\"font-weight: 700; font-size: 21px\">Next<\u002Fspan><span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px\">1–2 sprints · 9 pts<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600\">Answer more first questions, then make answers travel<\u002Fp>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B11 · V5 · E3 · ◆ GATED<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700\">Template coverage: top 10 analyst questions<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Attacks the biggest leak, unsupported first questions.<\u002Fspan>\n<span style=\"font-size: 14px; line-height: 1.4; background: #2a2e2c; border-radius: 8px; padding: 8px 10px; color: #c8e751\">Moves to Now if the concierge cohort retains like the template-answered one<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B4 · V4 · E3<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700\">Citation-ready export<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Replaces the CSV workaround 47% of analysts use to build citations by hand.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B2 · V4 · E3<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700\">Source-transaction drill-down<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Deeper verification once a first answer exists.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #9aa39f; color: #2a2e2c; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline\"><span style=\"font-weight: 700; font-size: 21px\">Later<\u002Fspan><span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px\">Backlog<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600\">Differentiate once activation clears 50%<\u002Fp>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B5 · V3 · E4 · ⚑ DEFERRED, NOT KILLED<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">What + who answer<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">The Step 5 differentiator, after activation is proven.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B3 · V3 · E2<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Reproducible permalink<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Copy-with-method already carries the citation.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B7 · V3 · E2<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Parameter dropdowns<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Used by 38% of analysts; keep as is.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #3d4240; border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #d6d4cc\">B8 · V1 · E1<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 700\">Show-the-SQL toggle<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45\">Serves SQL-natives; kept out of analyst onboarding.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.1em; color: #4a6340\">04 · CUT LIST<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">All three serve traders: 7% week-4 retention<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n<div style=\"background: #ffffff; border: 1.5px dashed #3d4240; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">B6 · V2 · E3<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700; text-decoration: line-through\">Wallet withdrawal alerts<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45; color: #3d4240\">A trader feature by the data. Existing alerts stay for traders.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1.5px dashed #3d4240; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">B9 · V1 · E5<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700; text-decoration: line-through\">Trade execution<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45; color: #3d4240\">Anti-persona, and Nansen already owns it.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1.5px dashed #3d4240; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">B10 · V1 · E4<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 700; text-decoration: line-through\">Memecoin live scanner<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45; color: #3d4240\">A speed race against GMGN we'd lose.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #ffffff; border: 1px solid #d6d4cc; border-radius: 14px; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 0.1em; color: #4a6340\">05 · DECISION WINDOW<\u002Fspan>\n<span style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4a5250\">4 weeks or 130 analyst signups<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: relative; height: 26px\">\n<span style=\"position: absolute; left: 24%; transform: translateX(-50%); font-family: 'Roboto Mono', monospace; font-size: 13px; white-space: nowrap\">41% today<\u002Fspan>\n<span style=\"position: absolute; left: 84%; transform: translateX(-50%); font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 500; white-space: nowrap\">56% target<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: relative; display: flex; height: 48px; border-radius: 8px; overflow: hidden; font-size: 15px; font-weight: 700\">\n<div style=\"width: 40%; background: #3d4240; color: #f5f4f0; display: flex; align-items: center; justify-content: center\">Kill or pivot · &lt;45%<\u002Fdiv>\n<div style=\"width: 20%; background: #d6d4cc; color: #2a2e2c; display: flex; align-items: center; justify-content: center\">Iterate<\u002Fdiv>\n<div style=\"width: 40%; background: #c8e751; color: #2a2e2c; display: flex; align-items: center; justify-content: center\">Scale · ≥50%<\u002Fdiv>\n<div style=\"position: absolute; left: 24%; top: 0; width: 2px; height: 48px; background: #c8e751\"><\u002Fdiv>\n<div style=\"position: absolute; left: 84%; top: 0; width: 2px; height: 48px; background: #2a2e2c\"><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.45; color: #3d4240\"><strong style=\"color: #2a2e2c\">Plus the gate for B11:<\u002Fstrong> if concierge-answered analysts retain like template-answered ones, answering causes the lift, and B11 moves to Now.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 32px; border-top: 1px solid #d6d4cc; padding-top: 18px\">\n<p style=\"margin: 0; font-size: 20px; font-weight: 700; color: #2a2e2c\">The rule: if a feature doesn't move analyst activation, its Value can't be 5.<\u002Fp>\n<p style=\"margin: 0; font-family: 'Roboto Mono', monospace; font-size: 13px; line-height: 1.5; color: #4a5250; text-align: right; flex-shrink: 0\">Value: Step 3 sample data + assumed persona evidence<br>Effort: PM estimates until sized with engineering<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:2640}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
